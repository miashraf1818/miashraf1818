<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0f0c29"/>
      <stop offset="50%"  stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>

    <!-- Shimmer / glow gradient -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#a78bfa" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        from="-1 0" to="1 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Top wave -->
    <clipPath id="wave-clip">
      <rect width="900" height="200"/>
    </clipPath>

    <!-- Purple glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bgGrad)"/>

  <!-- Shimmer overlay -->
  <rect width="900" height="200" fill="url(#shimmer)" opacity="0.6"/>

  <!-- Decorative wave at bottom -->
  <path d="M0,160 C150,130 300,180 450,155 C600,130 750,175 900,150 L900,200 L0,200 Z"
        fill="#a78bfa" opacity="0.08"/>
  <path d="M0,170 C200,145 400,190 600,165 C750,148 850,175 900,160 L900,200 L0,200 Z"
        fill="#7c3aed" opacity="0.12"/>

  <!-- Decorative circles -->
  <circle cx="820" cy="40"  r="55" fill="#7c3aed" opacity="0.08"/>
  <circle cx="800" cy="50"  r="30" fill="#a78bfa" opacity="0.1"/>
  <circle cx="90"  cy="160" r="60" fill="#302b63" opacity="0.3"/>
  <circle cx="70"  cy="150" r="25" fill="#a78bfa" opacity="0.08"/>

  <!-- Particle dots -->
  <g opacity="0.5">
    <circle cx="180" cy="30"  r="2" fill="#a78bfa"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="25"  r="1.5" fill="#c4b5fd"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="15"  r="2" fill="#a78bfa"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="170" r="1.5" fill="#c4b5fd"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="175" r="2" fill="#a78bfa"><animate attributeName="opacity" values="1;0.3;1" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="120" r="1.5" fill="#c4b5fd"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="40"  cy="80"  r="2" fill="#a78bfa"><animate attributeName="opacity" values="1;0.2;1" dur="1.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Main name text -->
  <text x="450" y="88"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="40" font-weight="700" letter-spacing="2"
        text-anchor="middle" fill="#ffffff" filter="url(#glow)">
    Mohammed Ikram Ashrafi
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>

  <!-- Purple underline accent -->
  <rect x="310" y="96" width="280" height="2" rx="1" fill="#a78bfa" opacity="0.8">
    <animate attributeName="width" from="0" to="280" dur="1.4s" fill="freeze"/>
    <animate attributeName="x"     from="450" to="310" dur="1.4s" fill="freeze"/>
  </rect>

  <!-- Subtitle -->
  <text x="450" y="130"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="15" font-weight="400" letter-spacing="1.5"
        text-anchor="middle" fill="#c4b5fd" opacity="0.95">
    AI Systems Engineer  •  Backend Developer  •  Building EchoVault AI
    <animate attributeName="opacity" values="0;0.95" dur="1.8s" fill="freeze"/>
  </text>

  <!-- Tag line -->
  <text x="450" y="158"
        font-family="'Courier New', 'JetBrains Mono', monospace"
        font-size="12" letter-spacing="2"
        text-anchor="middle" fill="#a78bfa" opacity="0.75">
    FastAPI  •  LangChain  •  RAG  •  Vector DBs  •  Docker  •  AWS
    <animate attributeName="opacity" values="0;0.75" dur="2.2s" fill="freeze"/>
  </text>
</svg>
